services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: deepfake-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: deepfake-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: unless-stopped
