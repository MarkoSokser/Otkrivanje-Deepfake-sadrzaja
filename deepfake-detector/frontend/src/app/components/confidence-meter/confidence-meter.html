<div class="w-full">
  <div class="flex justify-between items-center mb-2">
    <span class="text-gray-300 text-sm font-medium">{{ label }}</span>
    <span class="text-white font-bold text-xl">{{ displayValue }}%</span>
  </div>
  <div class="bg-gray-700 rounded-full h-5 overflow-hidden shadow-inner">
    <div
      class="h-5 rounded-full transition-all duration-700 ease-out bg-gradient-to-r"
      [class]="barGradient"
      [style.width.%]="displayValue"
    ></div>
  </div>
</div>
