<div
  class="border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer transition-colors duration-200 select-none"
  [class.border-blue-400]="isDragOver()"
  [class.bg-blue-950]="isDragOver()"
  [class.border-gray-500]="!isDragOver()"
  [class.hover:border-blue-400]="!isDragOver()"
  (click)="openFilePicker()"
>
  <!-- Upload cloud icon -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="w-14 h-14 mx-auto mb-4 text-gray-400"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5"
  >
    <path stroke-linecap="round" stroke-linejoin="round"
      d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.338-2.32 5.75 5.75 0 011.348 11.095H6.75z" />
  </svg>

  <p class="text-gray-200 text-lg font-medium mb-1">Povuci i ispusti datoteku ovdje</p>
  <p class="text-gray-400 text-sm">ili <span class="text-blue-400 underline">klikni za odabir</span></p>
  <p class="text-gray-500 text-xs mt-3">JPG, PNG, MP4, MOV, AVI · Maks. {{ maxSizeMB }} MB</p>
</div>

<!-- Hidden file input -->
<input
  #fileInput
  type="file"
  class="hidden"
  [accept]="accept"
  (change)="onFileInputChange($event)"
/>

<!-- Validation error -->
@if (errorMessage()) {
  <p class="mt-3 text-red-400 text-sm flex items-center gap-1">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
    </svg>
    {{ errorMessage() }}
  </p>
}
